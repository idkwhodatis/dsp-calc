name: Deploy on tag to the main site

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    # These endpoints belong to upstream, never publish fork artifacts there.
    if: github.repository == 'DSPCalculator/dsp-calc'

    runs-on: ubuntu-latest
    environment: netlify dsp-calc.pro

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - run: npm install netlify-cli -g

      - name: Deploy to netlify (main site)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: netlify deploy --dir dist --prod-if-unlocked
